# NuvaConnect — Despliegue del servidor relay con Docker Compose.
#
# Uso (desde la raíz del proyecto):
#   docker compose -f installer/server/docker-compose.yml up -d --build
#
# El relay queda escuchando en el puerto 9765. Para producción con TLS,
# ponlo detrás de un reverse proxy (ver el servicio "caddy" opcional abajo).

services:
  relay:
    build:
      context: ../..
      dockerfile: installer/server/Dockerfile
    image: nuvaconnect-relay:latest
    container_name: nuvaconnect-relay
    restart: unless-stopped
    environment:
      NUVA_RELAY_HOST: "0.0.0.0"
      NUVA_RELAY_PORT: "9765"
    ports:
      - "9765:9765"

  # --- OPCIONAL: TLS automático con Caddy (wss://) ------------------------
