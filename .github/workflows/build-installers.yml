name: Build Installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Empaquetar Host (PyInstaller)
        run: pyinstaller --noconfirm --clean installer/windows/nuvaconnect_host.spec
      - name: Empaquetar Viewer (PyInstaller)
        run: pyinstaller --noconfirm installer/windows/nuvaconnect_viewer.spec
      - name: Instalador Host (Inno Setup)
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows\NuvaConnect-Host.iss'
      - name: Instalador Viewer (Inno Setup)
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows\NuvaConnect-Viewer.iss'
      - name: Empaquetar servidor relay (exe)
        run: pyinstaller --noconfirm --onefile --name nuvaconnect-relay --hidden-import websockets --hidden-import cryptography --hidden-import msgpack run_server.py
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NuvaConnect-Windows
          path: |
            dist_installer/NuvaConnect-Host-Setup.exe
            dist_installer/NuvaConnect-Viewer-Setup.exe
            dist/nuvaconnect-relay.exe
      - name: Publicar en Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_installer/NuvaConnect-Host-Setup.exe
            dist_installer/NuvaConnect-Viewer-Setup.exe
            dist/nuvaconnect-relay.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          brew install create-dmg || true
      - name: Construir .dmg
        run: bash installer/macos/build_dmg.sh
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NuvaConnect-macOS
          path: dist_installer/NuvaConnect.dmg
      - name: Publicar en Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_installer/NuvaConnect.dmg

  build-server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadatos de imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/relay
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
