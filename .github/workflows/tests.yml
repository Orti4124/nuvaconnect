name: Tests

# Ejecuta la batería de pruebas del núcleo (red, cifrado, seguridad, archivos)
# en cada push y pull request. No requiere pantalla: solo dependencias base.

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del núcleo
        run: |
          python -m pip install --upgrade pip
          pip install "websockets>=12.0" "cryptography>=42.0" "msgpack>=1.0"

      - name: Verificar sintaxis
        run: python -c "import py_compile, glob; [py_compile.compile(f, doraise=True) for f in glob.glob('**/*.py', recursive=True)]; print('OK')"

      - name: Pruebas E2E (relay + cifrado + auth)
        run: python tests/test_e2e.py

      - name: Pruebas de transferencia de archivos
        run: python tests/test_filetransfer.py

      - name: Pruebas de seguridad (2FA, device, allowlist, anti-fuerza-bruta)
        run: python tests/test_security.py
